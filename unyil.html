<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem UNYIL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-main: #0B0F19; --bg-card: #1E293B; --accent: #10B981; --text-main: #F8FAFC; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Inter', sans-serif; padding: 20px; }
        .container { max-width: 450px; margin: auto; background: var(--bg-card); padding: 20px; border-radius: 12px; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #0F172A; border: 1px solid #334155; border-radius: 6px; color: white; }
        button { width: 100%; background: var(--accent); color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Data Operasional UNYIL</h2>
    
    <label>Tanggal:</label>
    <input type="date" id="tglUnyil">
    
    <label>Nama Item / Produk:</label>
    <input type="text" id="itemUnyil" placeholder="Masukkan nama item...">
    
    <label>Status / Catatan:</label>
    <input type="text" id="catatanUnyil" placeholder="Keterangan tambahan...">

    <button onclick="simpanUnyil()">Simpan ke Data UNYIL</button>
</div>

<script>
    const WEB_URL = "https://script.google.com/macros/s/AKfycbyPwPC3Egm8ogzLIi_WrpTfFYo_OhhnrzR7dDo2HqzmNXmSu8wazOdSwelNH8_A2zQpjw/exec";

    function simpanUnyil() {
        let data = {
            key: 'UNYIL',
            tgl: document.getElementById('tglUnyil').value,
            item: document.getElementById('itemUnyil').value,
            catatan: document.getElementById('catatanUnyil').value
        };
        
        let params = new URLSearchParams(data);
        
        fetch(WEB_URL, { method: "POST", mode: "no-cors", body: params })
        .then(() => alert('Data UNYIL berhasil dikirim!'))
        .catch(err => alert('Gagal: ' + err));
    }
    
    document.getElementById('tglUnyil').value = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
