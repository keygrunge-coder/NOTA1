<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Belanja - ALDI</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B0F19;
            --bg-card: #1E293B;
            --bg-input: #0F172A;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --accent: #3B82F6;
            --accent-hover: #2563EB;
            --danger: #EF4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            text-align: center;
            padding: 12px 0;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .row-inputs {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 8px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px dashed var(--accent);
            color: var(--accent);
            margin-top: 8px;
        }

        .btn-secondary:hover {
            background-color: rgba(59, 130, 246, 0.1);
        }

        /* Daftar Item di Keranjang */
        .cart-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            margin-top: 8px;
        }

        .cart-item {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-name {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .item-detail {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 8px;
        }

        .total-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            margin-top: 12px;
            font-weight: 700;
        }

        .total-amount {
            color: var(--accent);
            font-size: 1.1rem;
        }

        /* Loading overlay sederhana */
        #loading {
            display: none;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>INPUT BELANJA ALDI</h1>
            <p>Catat belanjaan dengan cepat & rapi</p>
        </header>

        <!-- Form Input Header -->
        <div class="card">
            <div class="form-group">
                <label>Tanggal Belanja</label>
                <input type="date" id="tgl">
            </div>
        </div>

        <!-- Form Tambah Barang -->
        <div class="card">
            <div class="row-inputs">
                <div class="form-group">
                    <label>Qty</label>
                    <input type="number" id="qty" placeholder="1" value="1">
                </div>
                <div class="form-group">
                    <label>Nama Barang</label>
                    <input type="text" id="barang" placeholder="Nama barang...">
                </div>
                <div class="form-group">
                    <label>Harga</label>
                    <input type="number" id="harga" placeholder="0">
                </div>
            </div>
            <button type="button" class="btn btn-secondary" onclick="tambahItem()">+ Tambah ke Daftar</button>
        </div>

        <!-- Daftar Keranjang Belanja -->
        <div class="card">
            <label style="margin-bottom: 8px;">Daftar Item Belanja</label>
            <div id="cartList" class="cart-list">
                <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 20px 0;">Belum ada item ditambahkan</div>
            </div>

            <div class="total-section">
                <span>Total Keseluruhan:</span>
                <span id="grandTotal" class="total-amount">Rp 0</span>
            </div>

            <button type="button" class="btn btn-primary" onclick="kirimData()" style="margin-top: 16px;">Kirim ke Spreadsheet</button>
            <div id="loading">Sedang mengirim data...</div>
        </div>
    </div>

    <script>
        // Set tanggal otomatis ke hari ini
        document.getElementById('tgl').valueAsDate = new Date();

        let cart = [];
        const WEB_URL = "https://script.google.com/macros/s/AKfycbwLxiI9_vhSdKm6VJ7YwTo7Ee0miD5W6oGxX3hMOJa8xJegWxufwbFwVyYFrC7dy5DIlg/exec";

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
        }

        function tambahItem() {
            let q = document.getElementById('qty').value;
            let b = document.getElementById('barang').value.trim();
            let h = document.getElementById('harga').value;

            if (!b || !h || q <= 0) {
                alert("Mohon isi Qty, Nama Barang, dan Harga dengan benar!");
                return;
            }

            cart.push({ q: Number(q), b: b, h: Number(h) });

            // Reset input barang & harga (biar cepat input berikutnya)
            document.getElementById('qty').value = "1";
            document.getElementById('barang').value = "";
            document.getElementById('harga').value = "";
            document.getElementById('barang').focus();

            renderCart();
        }

        function hapusItem(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function renderCart() {
            let listEl = document.getElementById('cartList');
            let grandTotalEl = document.getElementById('grandTotal');

            if (cart.length === 0) {
                listEl.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 20px 0;">Belum ada item ditambahkan</div>`;
                grandTotalEl.innerText = formatRupiah(0);
                return;
            }

            let html = "";
            let totalSemua = 0;

            cart.forEach((item, index) => {
                let subtotal = item.q * item.h;
                totalSemua += subtotal;
                html += `
                    <div class="cart-item">
                        <div class="item-info">
                            <span class="item-name">${item.b}</span>
                            <span class="item-detail">${item.q}x @ ${formatRupiah(item.h)} = <b>${formatRupiah(subtotal)}</b></span>
                        </div>
                        <button class="btn-delete" onclick="hapusItem(${index})">&times;</button>
                    </div>
                `;
            });

            listEl.innerHTML = html;
            grandTotalEl.innerText = formatRupiah(totalSemua);
        }

        function kirimData() {
            if (cart.length === 0) {
                alert("Keranjang masih kosong, bro!");
                return;
            }

            let tgl = document.getElementById('tgl').value;
            let loadingEl = document.getElementById('loading');

            loadingEl.style.display = "block";

            let params = new URLSearchParams();
            params.append("key", "SRF");
            params.append("type", "belanja");
            params.append("tgl", tgl);
            params.append("cartData", JSON.stringify(cart));

            fetch(WEB_URL, {
                method: "POST",
                mode: "no-cors", // Menghindari CORS error dari Apps Script
                body: params
            })
            .then(() => {
                loadingEl.style.display = "none";
                alert("Berhasil dikirim ke Spreadsheet, bro!");
                cart = []; // Kosongkan keranjang
                renderCart();
            })
            .catch(error => {
                loadingEl.style.display = "none";
                alert("Gagal mengirim data: " + error);
            });
        }
    </script>
</body>
</html>
