<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Belanja - LEORA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B0F19;
            --bg-card: #1E293B;
            --bg-input: #0F172A;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --accent: #3B82F6;
            --accent-hover: #2563EB;
            --danger: #EF4444;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 16px; display: flex; justify-content: center; }

        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }

        header { text-align: center; padding: 12px 0; }

        .card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }

        .form-group { margin-bottom: 12px; }

        label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }

        input { width: 100%; padding: 12px; background-color: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); outline: none; }

        .row-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }

        .btn-primary { background-color: var(--accent); color: white; margin-top: 8px; }

        .btn-secondary { background-color: transparent; border: 1px dashed var(--accent); color: var(--accent); margin-top: 8px; }

        .cart-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; margin-top: 8px; }

        .cart-item { background-color: var(--bg-input); padding: 10px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; }

        .btn-delete { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.2rem; }

        .total-section { display: flex; justify-content: space-between; margin-top: 12px; font-weight: 700; color: var(--accent); }
    </style>
</head>
<body>

    <div class="container">
        <header><h1>LEORA</h1></header>

        <div class="card">
            <div class="form-group">
                <label>Tanggal</label>
                <input type="date" id="tgl">
            </div>
        </div>

        <div class="card">
            <div class="form-group">
                <label>Nama Barang</label>
                <input type="text" id="barang" placeholder="Nama barang...">
            </div>
            <div class="row-inputs">
                <div class="form-group">
                    <label>Qty</label>
                    <input type="number" id="qty" value="1" oninput="hitungSubtotal()">
                </div>
                <div class="form-group">
                    <label>Harga Satuan</label>
                    <input type="number" id="harga" placeholder="0" oninput="hitungSubtotal()">
                </div>
            </div>
            <div style="text-align: right; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px;">
                Subtotal: <span id="previewSubtotal" style="color: white; font-weight: bold;">Rp 0</span>
            </div>
            <button class="btn btn-secondary" onclick="tambahItem()">+ Tambah ke Daftar</button>
        </div>

        <div class="card">
            <div id="cartList" class="cart-list"></div>
            <div class="total-section">
                <span>Total:</span>
                <span id="grandTotal">Rp 0</span>
            </div>
            <button class="btn btn-primary" onclick="kirimData()">Kirim ke Spreadsheet</button>
        </div>
    </div>

    <script>
        document.getElementById('tgl').valueAsDate = new Date();
        let cart = [];
        const WEB_URL = "https://script.google.com/macros/s/AKfycby90oba9XBjy32TXG1K9r-sTfAN-UJy5HwcyhzGBTsvYjS6VoMPKHkvbxKFJkIAs5Ri/exec";

        function formatRupiah(n) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n); }

        function hitungSubtotal() {
            let q = Number(document.getElementById('qty').value) || 0;
            let h = Number(document.getElementById('harga').value) || 0;
            document.getElementById('previewSubtotal').innerText = formatRupiah(q * h);
        }

        function tambahItem() {
            let q = document.getElementById('qty').value;
            let b = document.getElementById('barang').value.trim();
            let h = document.getElementById('harga').value;
            if(!b || !h) return alert("Isi nama dan harga!");
            cart.push({ q, b, h });
            document.getElementById('barang').value = "";
            document.getElementById('harga').value = "";
            renderCart();
        }

        function renderCart() {
            let listEl = document.getElementById('cartList');
            let total = 0;
            listEl.innerHTML = cart.map((item, i) => {
                total += item.q * item.h;
                return `<div class="cart-item"><span>${item.b} (${item.q}x)</span><span>${formatRupiah(item.q * item.h)}</span><button class="btn-delete" onclick="cart.splice(${i},1);renderCart()">&times;</button></div>`;
            }).join('');
            document.getElementById('grandTotal').innerText = formatRupiah(total);
        }

        function kirimData() {
            if(cart.length === 0) return alert("Kosong!");
            let params = new URLSearchParams({ key: "SRF", type: "belanja", tgl: document.getElementById('tgl').value, cartData: JSON.stringify(cart) });
            fetch(WEB_URL, { method: "POST", mode: "no-cors", body: params }).then(() => { alert("Terkirim!"); cart=[]; renderCart(); });
        }
    </script>
</body>
</html>
