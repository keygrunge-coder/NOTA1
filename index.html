<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRF Nota - Pilih Toko</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B0F19;
            --bg-card: #1E293B;
            --bg-input: #0F172A;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: #334155;
            --accent: #3B82F6;
            --success: #10B981;
            --danger: #EF4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            padding: 28px 24px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
        p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }

        /* Area Login Kunci */
        #authSection { margin-bottom: 20px; }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1rem;
            text-align: center;
            outline: none;
            margin-bottom: 12px;
        }
        input[type="password"]:focus { border-color: var(--accent); }

        .btn-auth {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Menu Toko (Hidden by default sampai kunci benar) */
        #menuSection { display: none; }
        .menu-list { display: flex; flex-direction: column; gap: 12px; }

        .btn-toko {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 16px 20px;
            background: var(--bg-input);
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .btn-toko:hover { border-color: var(--text-muted); background: #131c31; }
        
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .btn-unyil .dot { background-color: #3B82F6; box-shadow: 0 0 8px #3B82F6; }
        .btn-aldi .dot { background-color: #10B981; box-shadow: 0 0 8px #10B981; }
        .btn-leora .dot { background-color: #8B5CF6; box-shadow: 0 0 8px #8B5CF6; }

        .error-msg { color: var(--danger); font-size: 0.8rem; margin-top: 8px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>SRF Nota</h2>
    <p>Sistem Pencatatan Toko Terpadu</p>

    <!-- KUNCI AKSES -->
    <div id="authSection">
        <input type="password" id="accessKey" placeholder="Masukkan Kunci Akses...">
        <button class="btn-auth" onclick="cekKunci()">Masuk Aplikasi</button>
        <div id="errorMsg" class="error-msg">Kunci akses salah!</div>
    </div>

    <!-- PILIHAN TOKO -->
    <div id="menuSection">
        <p style="margin-bottom: 16px;">Silakan pilih toko tujuan:</p>
        <div class="menu-list">
            <a href="unyil.html" class="btn-toko btn-unyil">
                <span style="display:flex; align-items:center; gap:10px;"><i class="dot"></i> Nota Mang Unyil</span>
                <span>&rarr;</span>
            </a>
            <a href="aldi.html" class="btn-toko btn-aldi">
                <span style="display:flex; align-items:center; gap:10px;"><i class="dot"></i> Nota Aldi</span>
                <span>&rarr;</span>
            </a>
            <a href="leora.html" class="btn-toko btn-leora">
                <span style="display:flex; align-items:center; gap:10px;"><i class="dot"></i> Nota Leora</span>
                <span>&rarr;</span>
            </a>
        </div>
    </div>
</div>

<script>
    const KUNCI_BENAR = "SRF";

    function cekKunci() {
        const val = document.getElementById('accessKey').value.trim();
        if (val === KUNCI_BENAR) {
            localStorage.setItem('srf_key', val);
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('menuSection').style.display = 'block';
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    }

    // Auto-login jika sebelumnya sudah pernah buka & kunci tersimpan
    window.onload = function() {
        if (localStorage.getItem('srf_key') === KUNCI_BENAR) {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('menuSection').style.display = 'block';
        }
    }
</script>
</body>
</html>
