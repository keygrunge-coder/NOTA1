<!DOCTYPE html>
<html lang="id">
<head>

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0B0F19">
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">

    <!-- Header / Banner -->
    <header class="w-full py-8 px-6 text-center bg-slate-800/50 backdrop-blur-md border-b border-slate-700/50 shadow-lg relative">

        <div id="connectionStatus" class="absolute top-3 right-4 text-[10px] px-2 py-0.5 rounded-full font-medium bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">

        </div>

        <div class="max-w-md mx-auto">

            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">NOTA Dashboard</h1>
            <p class="text-sm text-slate-400 mt-1">Pilih halaman cepat di bawah ini</p>
        </div>
    </header>

    <!-- Main Content / Daftar Menu -->
    <main class="w-full max-w-md mx-auto px-4 py-6 flex-grow flex flex-col gap-3.5">
        
        <!-- Tombol Aldi -->
        <a href="aldi.html" class="group flex items-center justify-between p-4 rounded-2xl bg-slate-800/80 hover:bg-blue-600/10 border border-slate-700/60 hover:border-blue-500/50 transition-all duration-300 shadow-sm active:scale-[0.98]">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-lg group-hover:bg-blue-500 group-hover:text-white transition-all duration-300">
                    <i class="fa-solid fa-file-lines"></i>
                </div>
                <div>
                    <h2 class="font-semibold text-slate-200 group-hover:text-blue-400 transition-colors">Aldi</h2>
                    <p class="text-xs text-slate-400">Buka halaman aldi.html</p>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-blue-400 group-hover:translate-x-1 transition-all"></i>
        </a>

        <!-- Tombol Leora -->
        <a href="leora.html" class="group flex items-center justify-between p-4 rounded-2xl bg-slate-800/80 hover:bg-indigo-600/10 border border-slate-700/60 hover:border-indigo-500/50 transition-all duration-300 shadow-sm active:scale-[0.98]">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-lg group-hover:bg-indigo-500 group-hover:text-white transition-all duration-300">
                    <i class="fa-solid fa-file-lines"></i>
                </div>
                <div>
                    <h2 class="font-semibold text-slate-200 group-hover:text-indigo-400 transition-colors">Leora</h2>
                    <p class="text-xs text-slate-400">Buka halaman leora.html</p>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-indigo-400 group-hover:translate-x-1 transition-all"></i>
        </a>

        <!-- Tombol Unyil -->
        <a href="unyil.html" class="group flex items-center justify-between p-4 rounded-2xl bg-slate-800/80 hover:bg-emerald-600/10 border border-slate-700/60 hover:border-emerald-500/50 transition-all duration-300 shadow-sm active:scale-[0.98]">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-lg group-hover:bg-emerald-500 group-hover:text-white transition-all duration-300">
                    <i class="fa-solid fa-file-lines"></i>
                </div>
                <div>
                    <h2 class="font-semibold text-slate-200 group-hover:text-emerald-400 transition-colors">Unyil</h2>
                    <p class="text-xs text-slate-400">Buka halaman unyil.html</p>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-emerald-400 group-hover:translate-x-1 transition-all"></i>
        </a>

        <!-- Tombol Yusa -->
        <a href="yusa.html" class="group flex items-center justify-between p-4 rounded-2xl bg-slate-800/80 hover:bg-amber-600/10 border border-slate-700/60 hover:border-amber-500/50 transition-all duration-300 shadow-sm active:scale-[0.98]">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-lg group-hover:bg-amber-500 group-hover:text-white transition-all duration-300">
                    <i class="fa-solid fa-file-lines"></i>

                <div>

        </a>

    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-xs text-slate-500 border-t border-slate-800">
        &copy; 2026 NOTA &bull; Mobile Ready
    </footer>

    <!-- Script PWA Service Worker & Status Koneksi -->
    <script>
        function updateOnlineStatus() {
            const statusEl = document.getElementById('connectionStatus');
            if (navigator.onLine) {
                statusEl.className = "absolute top-3 right-4 text-[10px] px-2 py-0.5 rounded-full font-medium bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                statusEl.innerHTML = '<i class="fa-solid fa-circle text-[8px] mr-1"></i> Online';
            } else {
                statusEl.className = "absolute top-3 right-4 text-[10px] px-2 py-0.5 rounded-full font-medium bg-amber-500/20 text-amber-400 border border-amber-500/30";
                statusEl.innerHTML = '<i class="fa-solid fa-circle text-[8px] mr-1"></i> Offline Mode';
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
            });
        }
    </script>
</body>
</html>
