<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRF Nota - Pilih Toko</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B0F19;
            --bg-card: #1E293B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: #334155;
            --accent-unyil: #3B82F6;
            --accent-aldi: #10B981;
            --accent-leora: #8B5CF6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            padding: 28px 24px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .logo-badge {
            width: 54px;
            height: 54px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            font-size: 1.5rem;
        }

        h2 {
            color: var(--text-main);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-toko {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 16px 20px;
            background: #0F172A;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            border-radius: 12px;
            font-size: 0.95rem;
            border: 1px solid var(--border);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-toko span {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dot {
            width: 10-px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .btn-unyil .dot { background-color: var(--accent-unyil); box-shadow: 0 0 10px var(--accent-unyil); }
        .btn-aldi .dot { background-color: var(--accent-aldi); box-shadow: 0 0 10px var(--accent-aldi); }
        .btn-leora .dot { background-color: var(--accent-leora); box-shadow: 0 0 10px var(--accent-leora); }

        .btn-toko:hover {
            transform: translateY(-2px);
            border-color: var(--text-muted);
            background: #131c31;
        }

        .arrow {
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        .btn-toko:hover .arrow {
            transform: translateX(4px);
            color: var(--text-main);
        }

        .footer-note {
            margin-top: 24px;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-badge">⚡</div>
    <h2>SRF Nota</h2>
    <p>Pilih toko tujuan untuk mulai mencatat</p>
    
    <div class="menu-list">
        <a href="unyil.html" class="btn-toko btn-unyil">
            <span><i class="dot"></i> Nota Mang Unyil</span>
            <span class="arrow">&rarr;</span>
        </a>
        <a href="aldi.html" class="btn-toko btn-aldi">
            <span><i class="dot"></i> Nota Aldi</span>
            <span class="arrow">&rarr;</span>
        </a>
        <a href="leora.html" class="btn-toko btn-leora">
            <span><i class="dot"></i> Nota Leora</span>
            <span class="arrow">&rarr;</span>
        </a>
    </div>

    <div class="footer-note">Secure PWA System</div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>
</body>
</html>
